name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/library_ci_test
          JWT_SECRET: "12345678901234567890123456789012"
          FRONTEND_URL: "http://127.0.0.1:5173"

      - name: Build frontend
        run: npm run build
